- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: tidebloom
    - id: preset-tidebloom
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: tidebloom
        plugins:
          - id: self-extensions
            name: cordis:group
            group: true
            config:
              - id: greeting
                name: '@deepseek-ai/dsh-persona'
                config:
                  prefix: You are a Tidebloom snapshot agent.
          - id: tool-self-extend
            name: '@deepseek-ai/dsh-tool-self-extend'
            config:
              presetEntry: preset-tidebloom
              extensionGroup: self-extensions
    - id: parent-agent-preset
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/parent-agent-preset.ts'
      config:
        presets: [tidebloom]
