# `text-turn/model.cordis.yml` replaces the whole `agent-default-model` config
# with the route of the seed Session. This patch restates that route and adds the
# reasoning effort the adapter maps onto Kiro's `output_config.effort`;
# `kiro-fixture.mjs` rejects any request that does not carry `high`.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: !!js process.env.DSH_SNAPSHOT_PROVIDER
    model: !!js process.env.DSH_SNAPSHOT_MODEL
    reasoningEffort: high
