# Keyless replay and refresh composition for `kiro-provider`. The shared replay
# patch in `text-turn/cordis.snapshot.yml` applies only to the `default`
# composition, so this sibling restates the swaps it needs. The shipped
# `llm-kiro` adapter stays mounted and `kiro-fixture.mjs` answers its AWS
# requests, so request serialization, event-stream decoding, and stream
# translation run unmodified.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

# The headless profile disables the credential and authorization seams; the
# Kiro adapter requires both and reads its grant from the credential store.
- id: credentials
  disabled: false

- id: authorization
  disabled: false

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: kiro-fixture
      name: './kiro-fixture.mjs'
